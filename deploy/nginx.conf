# 安装目录默认 /opt/atmos-viz。改过位置就改下面的 root。
# .bin.br 的 Content-Encoding 由接口设置，这里只反代，不要让 nginx 再解一层。

server {
    listen 80;
    server_name _;

    root /opt/atmos-viz/frontend;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml wasm;
    gzip_min_length 1024;

    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
    }

    location /data/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_buffering off;
        gzip off;
    }

    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
