# 自签证书生成之后，用本文件换掉正在使用的 nginx.conf。
# 80 和 443 都开着。用 https:// 打开后，浏览器会声明 br，接口直接回 Brotli。
# 证书路径由 bin/self-signed.sh 写到 /opt/atmos-viz/certs/。安装目录不同就改下面三处。

server {
    listen 80;
    listen 443 ssl;
    server_name _;

    ssl_certificate     /opt/atmos-viz/certs/server.crt;
    ssl_certificate_key /opt/atmos-viz/certs/server.key;
    ssl_protocols       TLSv1.2 TLSv1.3;

    root /opt/atmos-viz/frontend;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml wasm;
    gzip_min_length 1024;

    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header Accept-Encoding $http_accept_encoding;
    }

    # .br 的 br / gzip / 原始字节由接口按 Accept-Encoding 决定。这里关掉 gzip，避免再压一层。
    location /data/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header Accept-Encoding $http_accept_encoding;
        proxy_buffering off;
        gzip off;
    }

    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
